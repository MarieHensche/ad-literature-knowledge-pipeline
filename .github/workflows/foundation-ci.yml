name: Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            hash-seed: "101"
          - python-version: "3.12"
            hash-seed: "1201"
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<10"

      - name: Compile source and tests
        run: >-
          python -m compileall -q
          ad_lit_pipeline pipeline_ui scripts tests

      - name: Run complete offline suite
        env:
          AD_LIT_TEST_OFFLINE: "1"
          PYTHONPATH: tests/offline:.
        run: python -m pytest -q

  foundation-gate:
    name: foundation-gate
    if: always()
    needs: offline-suite
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix run to pass
        env:
          OFFLINE_SUITE_RESULT: ${{ needs.offline-suite.result }}
        run: test "$OFFLINE_SUITE_RESULT" = "success"
