topic_id: urban_green_spaces_heat_resilience
research_topic:
  title: Urban Green Spaces and Heat Resilience
  description: Exploration of the role of urban green spaces, such as parks and street
    trees, in enhancing heat resilience in cities, along with their impacts on public
    health, thermal comfort, and urban heat island effects.
scope:
  include_criteria:
  - Papers directly studying the impact of urban green spaces on heat resilience
  - Papers examining related concepts such as thermal comfort, heat exposure, and
    public health outcomes in the context of urban environments
  - Reviews, meta-analyses, datasets, and empirical studies that provide insights
    into the relationship between urban greenery and climate adaptation
  exclude_criteria:
  - Papers focused solely on unrelated environmental or climatic factors without a
    connection to urban green spaces or heat resilience
  boundary_rules:
  - Include borderline or tangentially relevant papers when they address any meaningful
    aspect of urban green spaces and heat resilience.
  - Exclude only when the title and abstract conclusively indicate no relevance to
    the research question.
rule_based_screening:
  include_terms:
  - urban green spaces
  - heat resilience
  - parks
  - street trees
  - urban heat islands
  - thermal comfort
  - heat exposure
  - climate adaptation
  - public health
  - cooling effects
  - vegetation
  - microclimate
  - green infrastructure
  - urban ecology
  exclude_terms:
  - marine
  - desert
  - industrial
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    urban heat resilience or green space effects
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: ai_tagged
  categories:
    main_topic_category:
      values:
      - core_topic
      - adjacent_but_relevant
      - out_of_scope
      - mixed_or_unclear
      - unclear
      required: true
    research_target:
      values:
      - heat resilience
      - public health
      - thermal comfort
      - urban environment
      - climate adaptation
      - urban microclimate
      - vegetation
      - urban heat islands
    study_type:
      values:
      - empirical
      - review
      - method
      - dataset_or_resource
      - mixed_or_unclear
      - unclear
    location_type:
      values:
      - urban
      - suburban
      - rural
      - mixed_or_unclear
      - unclear
    knowledge_confidence:
      values:
      - high
      - medium
      - low
      - very_low
      - mixed_or_unclear
      - unclear
    review_status:
      values:
      - ai_tagged
      - human_reviewed
      - full_text_needed
      - excluded_from_scope
      required: true
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: urban green spaces and heat resilience
    reason: Direct inquiry into the main research question.
  - query: effects of parks on urban heat islands
    reason: Exploration of specific applications related to urban heat islands.
  - query: street trees thermal comfort urban areas
    reason: Focus on how street trees influence thermal comfort.
  - query: public health climate adaptation green spaces
    reason: Connection between public health outcomes and green spaces in climate
      adaptation.
  - query: vegetation cooling effects in cities
    reason: Examination of how vegetation contributes to cooling.
  - query: urban heat exposure mitigation strategies
    reason: Related strategies to reduce heat exposure in urban areas.
  - query: meta-analysis on urban greenery and health
    reason: Interest in systematic reviews and meta-analyses in this field.
  - query: heat resilience initiatives in urban planning
    reason: Broader look at initiatives that integrate heat resilience in urban design.
