scope:
  include_criteria:
  - Papers directly studying Alzheimer's disease using computational methods
  - Papers that examine methodologies, tools, and approaches in computational biology
    related to Alzheimer's
  - Reviews, meta-analyses, and empirical studies that help map the topic.
  exclude_criteria:
  - Papers focusing on unrelated neurological disorders that do not pertain to Alzheimer's
    disease.
  boundary_rules:
  - Include borderline or tangentially relevant papers when they address one meaningful
    aspect of computational biology methods in Alzheimer's research.
  - Exclude papers only when the title and abstract clearly indicate a lack of relevance
    to Alzheimer's disease or computational biology.
rule_based_screening:
  include_terms:
  - computational biology
  - Alzheimer's disease
  - bioinformatics
  - machine learning
  - data analysis
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
