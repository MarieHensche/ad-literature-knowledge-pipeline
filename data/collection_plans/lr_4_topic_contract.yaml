    reason: Gather studies employing statistical analysis techniques on Alzheimer's
      data.
  - query: Alzheimer's disease diagnosis computational biology
    reason: To find research on using computational biology for diagnosing Alzheimer's.
  - query: reviews computational biology Alzheimer's disease
    reason: To compile review articles on computational methodologies in the context
      of Alzheimer's research.
