scope:
  include_criteria:
  - Papers directly studying computational biology methods relevant to Alzheimer's
    disease
  - Reviews that explore computational techniques applied in the context of Alzheimer's
    research
  - Meta-analyses summarizing findings and methodologies related to computational
    approaches in the field
  exclude_criteria:
  - Papers that do not exhibit a substantive connection to Alzheimer's disease or
    computational biology methods
  boundary_rules:
  - Include borderline or tangentially relevant papers when they discuss methodologies
    applicable to Alzheimer's research.
  - Exclude only when the title and abstract clearly indicate irrelevance to the research
    focus.
rule_based_screening:
  include_terms:
  - computational methods
  - bioinformatics
  - Alzheimer's disease
  - genomic analysis
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    computational_methods_detail:
      required: false
      values:
      - bioinformatics_analysis
      - machine_learning_techniques
      - statistical_analysis_methods
      description: Provisional category for specific computational methods used in
        Alzheimer's research.
      selection: multi
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: Computational biology methods for Alzheimer's
    reason: Direct inquiry into computational methods applied in Alzheimer's research.
  - query: Bioinformatics and Alzheimer's disease
    reason: Exploring bioinformatics applications in Alzheimer's disease studies.
  - query: Machine learning in Alzheimer's research
    reason: Specifically focusing on the role of machine learning techniques in Alzheimer's
      research.
  - query: Genomic analysis for Alzheimer's disease
    reason: Investigating genomic analysis methods relevant to Alzheimer's disease.
  - query: Statistical methods in neurodegenerative research
    reason: Broader search on statistical methods utilized in the context of neurodegenerative
      studies.
  - query: Computational techniques Alzheimer's disease reviews
    reason: Searching for review papers that encompass computational methods in Alzheimer's
      research.
