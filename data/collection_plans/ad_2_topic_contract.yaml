topic_id: computational_biology_alzheimers
research_topic:
  title: Computational Biology Methods for Alzheimer's Disease Research
  description: Exploration of computational methods used in the study and treatment
    of Alzheimer's disease.
topic_structure:
  anchor_topic_id: alzheimers_disease
  anchor_reason: Alzheimer's disease is the central focus of this research direction.
  main_topics:
  - topic_id: alzheimers_disease
    label: Alzheimer's Disease
    field: title
    terms:
    - Alzheimer's disease
    - Alzheimer
    - AD
    - Alzheimer's
    - dementia
    - cognitive decline
    retrieval_terms:
    - Alzheimer's disease
    - AD
    - dementia
    matching_terms:
    - Alzheimer's
    - Alzheimer's disease
    - AD
    - cognitive decline
  - topic_id: computational_methods
    label: Computational Methods
    field: title
    terms:
    - computational biology
    - computational methods
    - bioinformatics
    - data analysis
    - machine learning
    - algorithm development
    retrieval_terms:
    - computational biology
    - bioinformatics
    - data analysis
    matching_terms:
    - computational methods
    - bioinformatics
    - machine learning
    - data analysis
    - algorithms
  secondary_topics:
    computational_methods:
    - secondary_topic_id: machine_learning
      label: Machine Learning Techniques
      field: title_or_abstract
      terms:
      - ML techniques
      - artificial intelligence
      - deep learning
      retrieval_terms:
      - AI
      - deep learning
      matching_terms:
      - machine learning techniques
      - ML
      - AI methods
      - deep learning models
    - secondary_topic_id: data_analysis
      label: Data Analysis Approaches
      field: title_or_abstract
      terms:
      - statistical analysis
      - data mining
      - pattern recognition
      retrieval_terms:
      - statistical analysis
      - data mining
      matching_terms:
      - analysis approaches
      - data mining techniques
      - statistical methods
scope:
  include_criteria:
  - Papers directly studying computational methods in Alzheimer's disease
  - Papers exploring applications of computational biology to Alzheimer's research
  - Reviews, meta-analyses, and datasets related to computational methods and Alzheimer's
  exclude_criteria:
  - Papers without a substantive focus on computational methods or Alzheimer's disease
  boundary_rules:
  - Include borderline papers if they contribute to the understanding of computational
    methods in relation to Alzheimer's disease
  - Exclude papers only when there is a clear lack of relevance to both core topics
rule_based_screening:
  include_terms:
  - computational biology
  - Alzheimer's disease
  - machine learning
  - bioinformatics
  - data analysis
  - cognitive decline
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata suggests relevance
  borderline_policy: include unless clearly unrelated
  human_review_policy: include for human review
  review_policy: include reviews and meta-analyses
  tangential_topic_policy: include when addressing relevant aspects of the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    computational_methods_detail:
      required: true
      values:
      - bioinformatics_techniques
      - machine_learning_applications
      - data_mining_strategies
      - statistical_methods
      description: Provisional category for methods used in computational biology
        related to Alzheimer's disease.
      selection: multi
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: computational biology in Alzheimer's disease
    reason: Broad exploration of the topic
  - query: machine learning and Alzheimer's research
    reason: Focusing on a key application
  - query: bioinformatics methods for Alzheimer's study
    reason: Targeting specific methodology
  - query: data analysis in Alzheimer's disease research
    reason: Exploring analytical approaches
  - query: Alzheimer's disease computational methods review
    reason: Review-focused search
  - query: AI applications in Alzheimer's research
    reason: Adjacent exploration of AI in the field
