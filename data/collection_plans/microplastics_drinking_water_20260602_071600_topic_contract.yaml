topic_id: microplastics_in_drinking_water
research_topic:
  title: 'Microplastics in Drinking Water: Assessing Human Health Risks'
  description: This research focuses on the prevalence of microplastics in drinking
    water, including sources, exposure pathways, possible human health risks, and
    implications for public health.
topic_structure:
  anchor_topic_id: microplastics_health_risks
  anchor_reason: This topic is essential as it directly links the presence of microplastics
    with potential health implications.
  main_topics:
  - topic_id: microplastics_health_risks
    label: Health Risks of Microplastics
    terms:
    - microplastics effects
    - toxicology of microplastics
    - health impacts of plastics
    - microplastic ingestion
    - human exposure microplastics
    - toxic chemical transport
    - additives in plastics
    - health outcomes microplastics
  - topic_id: drinking_water_sources
    label: Sources of Drinking Water Contamination
    terms:
    - tap water contamination
    - bottled water microplastics
    - water source pollution
    - microplastics in water supply
    - drinking water quality microplastics
    - microplastics assessment methods
    - water treatment challenges
    - removal techniques for microplastics
  secondary_topics:
    drinking_water_sources:
    - environmental pollution drinking water
    - microplastics source tracing
scope:
  include_criteria:
  - Papers directly studying microplastics in drinking water and human health risks
  - Papers examining methods for microplastics assessment and removal
  - Reviews and meta-analyses related to microplastics in public health contexts
  exclude_criteria:
  - Papers focusing on microplastics in non-drinking water environments
  - Papers without substantive relevance to human health risks
  boundary_rules:
  - Include borderline papers that address aspects of microplastics in human health
    contexts.
  - Exclude papers only if they clearly pertain to unrelated environmental issues.
rule_based_screening:
  include_terms:
  - microplastic presence
  - microplastic health risks
  - drinking water contamination
  - human exposure microplastics
  - risk assessment microplastics
  - toxicity of microplastics
  - additives in plastics
  - exposure pathways
  exclude_terms:
  - microplastics in food
  - marine microplastics
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: ai_tagged
  categories:
    main_topic_category:
      values:
      - core_topic
      - adjacent_but_relevant
      - out_of_scope
      - mixed_or_unclear
      - unclear
      required: true
    research_target:
      values:
      - human_health
      - environmental_health
      - populations_at_risk
      - chemical_exposure
      - mixed_or_unclear
      - unclear
    study_type:
      values:
      - empirical
      - review
      - method
      - dataset_or_resource
      - mixed_or_unclear
      - unclear
    knowledge_confidence:
      values:
      - high
      - medium
      - low
      - very_low
      - conflict
    review_status:
      values:
      - ai_tagged
      - human_reviewed
      - full_text_needed
      - excluded_from_scope
      required: true
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: microplastics in drinking water
    reason: Direct examination of microplastics in drinking water.
  - query: health risks from microplastics
    reason: Exploring the health implications of microplastics.
  - query: tap water microplastics
    reason: Focusing on microplastics present specifically in tap water.
  - query: public health microplastics
    reason: Investigating the public health dimensions of microplastics.
  - query: microplastics exposure assessment
    reason: Assessment of exposure levels to microplastics.
  - query: bottled water microplastics
    reason: Exploring microplastics in bottled water sources.
  - query: toxicity of microplastics
    reason: Understanding the toxicological effects of microplastics on health.
  - query: microplastics risk assessment
    reason: Evaluating risks associated with microplastic exposure.
