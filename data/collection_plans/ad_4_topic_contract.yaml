scope:
  include_criteria:
  - Papers directly studying Alzheimer's Disease using computational methods
  - Research papers exploring applications of computational biology in dementia
  - Reviews and meta-analyses addressing computational approaches for Alzheimer's
  exclude_criteria:
  - Papers that do not mention Alzheimer's Disease or relevant computational methods
  boundary_rules:
  - "Include borderline papers that mention both Alzheimer\u2019s Disease and computational\
    \ methods in a meaningful way."
  - Exclude papers that focus solely on unrelated neurological disorders.
rule_based_screening:
  include_terms:
  - computational biology
  - Alzheimer's
  - bioinformatics
  - machine learning
  - genomic analysis
  - dementia
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    alzheimers_research:
      required: true
      values:
      - clinical_studies
      - preclinical_studies
      - systematic_reviews
      - meta_analyses
      description: Research directly focused on Alzheimer's Disease.
      selection: single
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: computational biology methods in Alzheimer's Disease
    reason: Exploring direct application of computational methods.
  - query: bioinformatics approaches for Alzheimer's research
    reason: Targeting bioinformatics specific to Alzheimer's.
  - query: AI techniques in Alzheimer's studies
    reason: Focusing on AI applications.
  - query: machine learning for Alzheimer disease
    reason: Investigating machine learning contributions.
  - query: Alzheimer's disease computational research
    reason: General research inquiries.
  - query: data analysis in Alzheimer's research
    reason: Data analysis relevance.
