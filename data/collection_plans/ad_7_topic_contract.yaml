scope:
  include_criteria:
  - Papers directly studying computational methods in Alzheimer's research
  - Reviews and overviews of computational techniques used for Alzheimer's disease
  - Studies discussing applications of computational biology in neurodegenerative
    disorders
  exclude_criteria:
  - Papers with no substantive association with Alzheimer's Disease or computational
    methods
  - Studies focused solely on therapeutic applications without computational analysis
  boundary_rules:
  - Include borderline papers if they discuss computational aspects of neurodegenerative
    conditions.
  - Exclude papers that do not mention Alzheimer's Disease or relevant computational
    methodologies.
rule_based_screening:
  include_terms:
  - Alzheimer's disease methods
  - computational techniques
  - bioinformatics approaches
  - machine learning in Alzheimer's
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata indicates relevancy
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the question explicitly requests primary studies
    only
  tangential_topic_policy: include candidates that discuss relevant computational
    technology
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    computational_methods:
      required: true
      values:
      - bioinformatics
      - machine_learning
      - data_analysis
      - genomic_analysis
      description: Methods and techniques in computational biology relevant to Alzheimer's
        disease.
      selection: multi
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: computational biology methods for Alzheimer's disease
    reason: Directly addresses the question.
  - query: bioinformatics in Alzheimer's research
    reason: Focus on a specific computational approach relevant to the disease.
  - query: machine learning applications in dementia studies
    reason: Explores adjacent methodologies in the same context.
  - query: neurodegenerative disease computational techniques
    reason: Broader search for related methodologies.
  - query: statistical methods in Alzheimer's studies
    reason: Specific method-related inquiry.
  - query: Alzheimer's disease review papers on computational studies
    reason: To find overview papers as part of the discovery process.
