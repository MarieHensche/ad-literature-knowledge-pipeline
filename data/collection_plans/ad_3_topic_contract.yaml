scope:
  include_criteria:
  - Papers directly studying computational methods in Alzheimer's research
  - Papers investigating applications of bioinformatics and computational biology
    techniques
  - Reviews and meta-analyses exploring computational approaches for understanding
    Alzheimer's disease
  exclude_criteria:
  - Papers unrelated to the intersection of computational biology and Alzheimer's
    disease
  boundary_rules:
  - Include papers that are tangentially relevant if they address meaningful aspects
    of computational methods or Alzheimer's.
  - Exclude papers when title and abstract clearly indicate off-topic research.
rule_based_screening:
  include_terms:
  - Alzheimer's disease
  - computational biology
  - bioinformatics
  - machine learning
  - dementia
  - data analysis
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata indicates potential relevance
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless explicitly requested otherwise
  tangential_topic_policy: include candidates that touch on relevant aspects of computational
    biology or Alzheimer's
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    computational_methods_detail:
      required: false
      values:
      - bioinformatics
      - genomic_analysis
      - machine_learning
      - data_visualization
      description: Techniques and methodologies in computational biology related to
        Alzheimer's.
      selection: multi
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: Computational biology methodologies for Alzheimer's Disease
    reason: Explores the broad methodologies used in the research context.
  - query: Machine learning in Alzheimer's research
    reason: Focuses on the specific application of ML techniques in the field.
  - query: Bioinformatics tools for AD studies
    reason: Targets the computational tools used for studies about Alzheimer's.
  - query: Early detection of Alzheimer's disease using computational methods
    reason: Investigates how computational tools help in early diagnosis.
  - query: Genomics and Alzheimer's research
    reason: Focuses on the genomic aspect of Alzheimer's study.
  - query: Statistical models for Alzheimer's disease prediction
    reason: Covers statistical approaches for predicting AD outcomes.
  - query: Neurodegenerative disease computational analysis
    reason: Looks at broader computational analyses relevant to neurodegenerative
      diseases.
  - query: Alzheimer's biomarkers identified through computational tools
    reason: Explores biomarker discovery using computational methods in Alzheimer's.
