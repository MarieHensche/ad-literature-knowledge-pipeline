scope:
  include_criteria:
  - Papers directly studying Alzheimer's disease
  - Studies using computational methods applicable to Alzheimer's research
  - Reviews and meta-analyses related to Alzheimer's disease and computational biology
  exclude_criteria:
  - Unrelated topics with no connection to Alzheimer's disease
  boundary_rules:
  - Include borderline papers that touch on Alzheimer's or computational methods if
    one meaningful aspect is discussed.
  - Exclude papers that do not contain relevant terminology in the title or abstract.
rule_based_screening:
  include_terms:
  - Alzheimer's disease
  - AD
  - computational biology
  - bioinformatics
  - machine learning
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata suggests relevance to Alzheimer's
    disease or computational biology
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the question requests primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    computational_methods:
      required: false
      values:
      - bioinformatics
      - machine_learning
      - data_analysis
      description: Focus on computational methods used in Alzheimer's disease research.
      selection: multi
