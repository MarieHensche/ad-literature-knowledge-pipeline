topic_id: green_roofs_stormwater_management
research_topic:
  title: Green Roofs and Stormwater Management in Urban Environments
  description: An exploration of how green roofs contribute to stormwater management
    in cities, focusing on aspects such as runoff reduction, water retention, urban
    flooding, vegetation, substrate depth, and adaptation to climate change.
scope:
  include_criteria:
  - Papers directly studying the role of green roofs in stormwater management.
  - Studies investigating relationships between green roofs and urban water retention
    strategies.
  - Research addressing the impact of vegetation and substrate depth in mitigating
    urban flooding.
  - Reviews, meta-analyses, and empirical studies related to green roofs and their
    effectiveness in managing stormwater.
  exclude_criteria:
  - Papers that do not directly address stormwater management or green roofs.
  boundary_rules:
  - Include studies that are tangentially relevant if they address meaningful aspects
    of green roofs and urban hydrology.
  - Exclude papers only when the title and abstract clearly indicate a disconnect
    from the topic.
rule_based_screening:
  include_terms:
  - green roofs
  - living roofs
  - stormwater management
  - urban flooding
  - water retention
  - runoff reduction
  - vegetative roofs
  - substrate depth
  - climate adaptation
  - green infrastructure
  - nature-based solutions
  - urban hydrology
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata suggests relevance.
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the focus is strictly on primary studies.
  tangential_topic_policy: include candidates that present relevant aspects of green
    roofs and stormwater issues.
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: ai_tagged
  categories:
    main_topic_category:
      values:
      - core_topic
      - adjacent_but_relevant
      - out_of_scope
      - mixed_or_unclear
      - unclear
      required: true
    research_target:
      values:
      - primary_target
      - related_target
      - outcome
      - methodological_aspect
      - mixed_or_unclear
      - unclear
    study_type:
      values:
      - empirical
      - review
      - commentary
      - dataset
      - mixed_or_unclear
      - unclear
    climate_adaptation:
      values:
      - success
      - challenges
      - best_practices
      - mixed_or_unclear
      - unclear
    vegetation_type:
      values:
      - native
      - non_native
      - mixed_or_unclear
      - unclear
    outcome_type:
      values:
      - water_quality
      - runoff_reduction
      - nutrient_removal
      - flood_mitigation
      - mixed_or_unclear
      - unclear
    review_status:
      values:
      - ai_tagged
      - human_reviewed
      - full_text_needed
      - excluded_from_scope
      required: true
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: green roofs stormwater management
    reason: Direct inquiry into the core research question.
  - query: living roofs runoff reduction
    reason: Alternative phrasing focusing on runoff.
  - query: urban flooding green infrastructure
    reason: Explores the relationship between flooding and infrastructure.
  - query: water retention green roofs
    reason: Focuses on a specific aspect related to green roofs.
  - query: substrate depth and urban vegetation
    reason: Looks at the role of substrate in urban environments.
  - query: climate adaptation urban landscapes
    reason: Broader context of adaptation strategies.
  - query: effects of green roofs on water quality
    reason: Investigates a related outcome of green roofs.
  - query: green roofs empirical studies
    reason: Searches for applied research and studies.
