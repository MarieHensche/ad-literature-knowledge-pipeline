scope:
  include_criteria:
  - Papers directly studying artificial intelligence applications in Alzheimer's research
  - Studies exploring AI methodology as applied to Alzheimer's disease
  - Review papers that summarize AI techniques related to Alzheimer's disease
  exclude_criteria:
  - Papers not addressing Alzheimer's disease or AI
  boundary_rules:
  - Include borderline papers that reference AI in a context relevant to Alzheimer's
    disease.
  - Exclude papers with irrelevant titles and abstracts unrelated to the focus.
rule_based_screening:
  include_terms:
  - artificial intelligence
  - AI
  - Alzheimer's disease
  - dementia
  - cognitive decline
  exclude_terms: []
  exclude_wins: false
candidate_screening:
  missing_abstract_policy: include if title or metadata is plausibly relevant
  borderline_policy: include
  human_review_policy: include
  review_policy: include reviews unless the research question explicitly asks for
    primary studies only
  tangential_topic_policy: include candidates that address one meaningful aspect of
    the topic
tagging:
  fallback_policy:
    prefer_unclear_when_allowed: false
    prefer_mixed_or_unclear_when_unclear_missing: false
    missing_information_value: ''
  categories:
    alzheimer_disease_research:
      required: true
      values:
      - early_detection
      - treatment_effectiveness
      - diagnostic_methods
      description: Provisional category for studies related to Alzheimer's disease.
      selection: multi
collection:
  allowed_providers:
  - openalex
  preferred_provider: openalex
  max_results_default: 50
  exclude_openalex_review_type: false
  search_queries:
  - query: artificial intelligence Alzheimer disease
    reason: Direct application of AI to Alzheimer's research
  - query: AI methods Alzheimer disease
    reason: Exploring AI methodologies relevant to Alzheimer's
  - query: machine learning Alzheimer's disease
    reason: Specific focus on machine learning in Alzheimer's research
  - query: AI applications dementia
    reason: Broader AI applications in dementia research
  - query: cognitive decline AI
    reason: AI's role in studying cognitive decline
  - query: computer vision Alzheimer's disease
    reason: AI's computer vision applications in Alzheimer's research
