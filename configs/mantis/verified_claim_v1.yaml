template_schema_version: 1.0.0
profile_version: 1.0.0
compatibility_version: 1.0.0
record_kind: verified_claim
source_contract: mantis_verified_claim_projection
source_schema_version: 1.0.0
eligible_statuses: [supported, contradicted]
point_id_source_path: point_id
fields:
  - {output_name: title, source_path: title, mantis_type: Title, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: semantic, source_path: semantic, mantis_type: Semantic, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: 0}
  - {output_name: point_id, source_path: point_id, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: verification_outcomes, source_path: verification_outcomes, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: claim_type, source_path: claim_type, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: direction, source_path: direction, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: source_version_id, source_path: source_version_id, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: claim_evidence_ids, source_path: claim_evidence_ids, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: passage_ids, source_path: passage_ids, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: population, source_path: population, mantis_type: Categoric, required: false, null_policy: empty, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: method, source_path: method, mantis_type: Categoric, required: false, null_policy: empty, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: outcome, source_path: outcome, mantis_type: Categoric, required: false, null_policy: empty, multivalue_policy: join, separator: " | ", semantic_order: null}
  - {output_name: verified_at, source_path: verified_at, mantis_type: Date, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
  - {output_name: snapshot_id, source_path: snapshot_id, mantis_type: Categoric, required: true, null_policy: error, multivalue_policy: error, separator: null, semantic_order: null}
semantic_text: {strategy: claim_text, separator: "\n\n"}
row_sort_paths: [point_id]
csv_policy: {encoding: utf-8, line_terminator: "\n", null_sentinel: "", quote_minimal: true}
supported_tool_versions: [mantisai-cli==3.7.0]
connection_compatibility_verified: false
