scope:
  include_criteria:
    - Studies on AI use during teaching, learning, studying, or course activities
    - Studies evaluating educational applications of AI in formal education settings
    - Studies examining impacts on learning outcomes, engagement, motivation, participation, or student experience
    - Studies on teacher-supported or instructor-supported use of AI tools
    - Studies on AI-supported personalization, tutoring, feedback, collaborative learning, or instructional support
    - Empirical studies, systematic reviews, meta-analyses, and educational interventions
    - Studies involving students, teachers, instructors, or learners in formal educational settings

  exclude_criteria:
    - Studies outside formal education or learner-support contexts

  boundary_rules:
    - Include studies where AI is used as a learning support tool during instruction
    - Include studies where AI acts as tutor, assistant, feedback system, or personalized learning support
    - Include studies evaluating teacher-guided, instructor-guided, or student-facing use of generative AI tools
    - Prefer studies evaluating learning effects and pedagogical implications over technological descriptions

rule_based_screening:
  include_terms:
    - artificial intelligence in education
    - AI in classroom
    - classroom AI
    - generative AI
    - ChatGPT in education
    - AI in higher education
    - AI in teaching and learning
    - AI in schools
    - AI in education
    - AI tutoring
    - intelligent tutoring system
    - adaptive learning
    - personalized learning
    - AI-assisted learning
    - AI-supported teaching
    - AI-supported learning
    - student learning outcomes
    - classroom intervention
    - educational intervention
    - educational AI
    - student engagement
    - learning impact

  exclude_terms:
    - robotics engineering

  exclude_wins: true

candidate_screening:
  missing_abstract_policy: exclude
  borderline_policy: include
  human_review_policy: include
  review_policy: exclude
  tangential_topic_policy: >
    include candidates that address one meaningful aspect of AI use, teaching,
    learning, learners, instructors, or educational impact

tagging:
  evidence_policy: abstract_or_full_text
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: ai_tagged

  categories:

    main_topic_category:
      required: true
      values:
        - core_topic
        - adjacent_but_relevant
        - out_of_scope
        - mixed_or_unclear
        - unclear

    learning_impact:
      values:
        - positive
        - negative
        - mixed
        - no_effect
        - unclear

    research_target:
      values:
        - academic_performance
        - engagement
        - motivation
        - critical_thinking
        - creativity
        - collaboration
        - participation
        - learning_experience
        - behavior
        - mixed_or_unclear
        - unclear

    education_level:
      values:
        - elementary
        - middle_school
        - high_school
        - primary_secondary_mixed
        - vocational
        - higher_education
        - multiple_or_general_education
        - unclear

    ai_role:
      values:
        - tutor
        - assistant
        - feedback_provider
        - facilitator
        - content_support
        - personalized_support
        - mixed_or_unclear
        - unclear

    study_type:
      values:
