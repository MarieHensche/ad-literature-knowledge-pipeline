scope:
  include_criteria:
    - detecting Alzheimer's disease or dementia
    - detecting MCI or cognitive impairment
    - distinguishing AD, MCI, dementia, or controls
    - identifying early, prodromal, or preclinical AD
    - predicting or detecting MCI-to-AD conversion when framed as early detection
    - screening dementia-related impairment from clinical, behavioral, imaging, omics, sensor, speech, retinal, EEG, or multimodal evidence
  exclude_criteria:
    - drug discovery or treatment response
    - care support without a detection or screening task
    - disease mechanism discovery without a diagnostic or early-detection task
    - subtype discovery without an early-detection framing
    - later-stage prognosis only
    - non-computational clinical reporting
    - review or background paper only
  boundary_rules:
    - If a paper says early diagnosis but only performs AD-vs-control classification, keep it in scope but tag the comparison structure accurately.

rule_based_screening:
  include_terms:
    - early detection
    - early diagnosis
    - early dementia
    - mild cognitive impairment
    - mci
    - screening
    - classification
    - diagnosis
    - detecting
    - detection
  exclude_terms:
    - drug repurposing
    - drug discovery
    - treatment
    - treatment response
    - care support
  exclude_wins: true

candidate_screening:
  missing_abstract_policy: exclude
  borderline_policy: include
  human_review_policy: include
  review_policy: exclude
  tangential_topic_policy: >
    include candidates that address one meaningful aspect of early detection,
    screening, diagnosis, impairment, biomarkers, or prediction

tagging:
  evidence_policy: abstract_or_full_text
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: ai_tagged
  categories:
