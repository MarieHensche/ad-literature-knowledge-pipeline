topic_id: early_detection_ad

research_topic:
  title: Early detection of Alzheimer's disease and related impairment
  description: >
    Computational papers about early detection of Alzheimer's disease,
    mild cognitive impairment, dementia, or dementia-related cognitive impairment.
    The focus is on what early disease state, impairment, or signal is identified.

scope:
  include_criteria:
    - detecting Alzheimer's disease or dementia
    - detecting MCI or cognitive impairment
    - distinguishing AD, MCI, dementia, or controls
    - identifying early, prodromal, or preclinical AD
    - predicting or detecting MCI-to-AD conversion when framed as early detection
    - screening dementia-related impairment from clinical, behavioral, imaging, omics, sensor, speech, retinal, EEG, or multimodal evidence
  exclude_criteria:
    - drug discovery or treatment response
    - care support without a detection or screening task
    - disease mechanism discovery without a diagnostic or early-detection task
    - subtype discovery without an early-detection framing
    - later-stage prognosis only
    - non-computational clinical reporting
    - review or background paper only
  boundary_rules:
    - If a paper says early diagnosis but only performs AD-vs-control classification, keep it in scope but tag the comparison structure accurately.

rule_based_screening:
  include_terms:
    - early detection
    - early diagnosis
    - early dementia
    - mild cognitive impairment
    - mci
    - screening
    - classification
    - diagnosis
    - detecting
    - detection
  exclude_terms:
    - drug repurposing
    - drug discovery
    - treatment
    - treatment response
    - care support
  exclude_wins: true

candidate_screening:
  missing_abstract_policy: exclude
  borderline_policy: exclude
  human_review_policy: exclude
  review_policy: include reviews only when the topic does not ask for primary studies only

tagging:
  fallback_policy:
    prefer_unclear_when_allowed: true
    prefer_mixed_or_unclear_when_unclear_missing: true
    missing_information_value: not_reported
    knowledge_confidence: very_low
    review_status: needs_decision
  categories:
    primary_clinical_target:
      values:
        - ad
        - mci
        - dementia
        - cognitive_impairment
        - prodromal_ad
        - preclinical_ad
        - mixed_or_unclear
        - unclear

    early_detection_subtype:
      values:
        - early_ad_detection
        - mci_detection
        - mci_ad_detection
        - dementia_screening
        - prodromal_detection
        - preclinical_detection
        - conversion_or_deterioration_detection
        - mixed_or_unclear

    population_scope:
      values:
        - ad_vs_control
        - mci_vs_control
        - ad_vs_mci
        - ad_vs_mci_vs_control
        - dementia_vs_control
        - cognitive_impairment_vs_control
        - mci_conversion
        - multi_stage_early_disease
        - mixed_clinical
        - unclear

    baseline_phase:
      values:
        - healthy_or_control
        - subjective_complaint
        - mci
        - early_ad
        - mixed_early
        - not_phase_specific
        - not_reported
        - unclear

    comparison_group_category:
