profiles:
  computational_methods:
    label: Computational methods
    kind: method
    requires_method_topic: true
    signal_terms: [AI, algorithm, algorithms, artificial intelligence, bioinformatics, computational, computational biology, machine learning, ML]
    family_terms: []
    excluded_terms: []
    completion_terms:
      - machine learning
      - ML
      - artificial intelligence
      - AI
      - deep learning
      - supervised learning
      - unsupervised learning
      - statistical modeling
      - network analysis
      - systems biology
      - predictive modeling
    fallback_secondary_group_ids: [experimental_methods]
    anchor_over_kinds: []
    guidance:
      - Keep computational submethods in the parent method topic rather than representing them as adjacent secondary topics.
      - When a clean adjacent method direction is needed, use the configured experimental-methods group.
      - Remove bare research objects from method-topic terms; method terms should name methods, submethods, models, or method-qualified applications.
  alzheimer_disease:
    label: Alzheimer's disease
    kind: disease
    requires_method_topic: false
    signal_terms: [AD, Alzheimer, Alzheimer disease, Alzheimer's disease, Alzheimers disease]
    family_terms:
      - AD
      - Alzheimer
      - Alzheimer disease
      - Alzheimer's disease
      - Alzheimers disease
      - cognitive decline
      - dementia
      - dementia-related cognitive impairment
      - dementia related cognitive impairment
      - MCI
      - mild cognitive impairment
      - preclinical AD
      - preclinical Alzheimer disease
      - preclinical Alzheimer's disease
      - preclinical Alzheimers disease
      - preclinical disease
      - prodromal AD
      - prodromal Alzheimer disease
      - prodromal Alzheimer's disease
      - prodromal Alzheimers disease
      - prodromal disease
    excluded_terms: [amyloid plaque, amyloid plaques, amyloid pathology, memory loss, neurodegeneration, tau pathology, tau tangles]
    completion_terms:
      - Alzheimer's disease
      - Alzheimer disease
      - AD
      - dementia
      - cognitive decline
      - mild cognitive impairment
      - MCI
      - prodromal Alzheimer's disease
      - preclinical Alzheimer's disease
      - dementia-related cognitive impairment
    fallback_secondary_group_ids: [parkinsons_disease, cancer]
    anchor_over_kinds: [method]
    guidance:
      - Treat the disease family as the non-replaceable anchor when it is paired with a method topic.
      - Keep configured disease-family names, abbreviations, stages, and impairment states in the parent disease topic.
      - Remove configured pathology, mechanism, biomarker, symptom, and process terms from disease-family topic terms.
      - Use the configured adjacent-disease groups when no clean secondary group remains.

generic_guidance:
  - Each main topic represents exactly one necessary conceptual area; do not merge relationships or whole questions into one topic.
  - The anchor is the non-replaceable title-screening concept and must use the title field.
  - For source/tool/intervention/application questions, anchor on the named source when papers about the destination without that source would be off-topic.
  - Main-topic terms remain component-pure and include useful in-family names, variants, subtypes, abbreviations, and surface forms.
  - Retrieval terms are high-signal, component-pure, and limited to twelve; matching terms may be broader.
  - Secondary topics are adjacent sibling directions, never aliases, versions, variants, examples, or internal subtypes of the parent.
  - Every secondary group names one concept and contains only that concept's aliases and surface forms.
  - Parent and secondary term groups remain disjoint.
  - Generated main-topic fields default to title; title_or_abstract is reserved for explanatory details, and abstract-only main topics are not allowed.
  - Preserve explicit user vocabulary and use configured concept profiles for domain-specific completion, exclusions, anchoring, and fallbacks.
